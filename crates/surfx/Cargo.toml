[package]
name = "surfx"
version.workspace = true
edition.workspace = true

[dependencies]
clap = { workspace = true }
surfoxide-core = { path = "../surfoxide-core" }
surfoxide-io = { path = "../surfoxide-io" }
surfoxide-mask = { path = "../surfoxide-mask" }
surfoxide-topofix = { path = "../surfoxide-topofix" }
surfoxide-extract = { path = "../surfoxide-extract" }
surfoxide-check = { path = "../surfoxide-check" }
surfoxide-remesh = { path = "../surfoxide-remesh" }
surfoxide-repair = { path = "../surfoxide-repair" }
surfoxide-pial = { path = "../surfoxide-pial" }
surfoxide-metrics = { path = "../surfoxide-metrics" }
surfoxide-learn = { path = "../surfoxide-learn" }
serde = { workspace = true }
serde_json = { workspace = true }
rayon = { workspace = true }
burn = { workspace = true, features = ["flex"] }

[features]
wgpu = ["burn/wgpu"]
cuda = ["burn/cuda", "surfoxide-learn/cuda"]
