[package]
name = "surfoxide-burn"
version.workspace = true
edition.workspace = true

[dependencies]
burn = { workspace = true }
surfoxide-core = { path = "../surfoxide-core" }

[dev-dependencies]
burn = { workspace = true, features = ["flex", "autodiff"] }
surfoxide-metrics = { path = "../surfoxide-metrics" }
surfoxide-io = { path = "../surfoxide-io" }

[features]
cuda = ["burn/cuda"]

[[example]]
name = "ops_gpu"
required-features = ["cuda"]
